name: WorkBuddy 每日签到 + 猫猫旅行

# 触发方式（两条并存，互为保险）
# ---------------------------------------------------------------------------
#   1) workflow_dispatch —— **主触发**。
#      由外部免费定时器（cron-job.org）每天 10:10（中国标准时间）调用下面这个接口：
#        POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/daily.yml/dispatches
#        body: {"ref":"main"}
#      为什么不用 GitHub 自带的 schedule 做主触发：GitHub 的 schedule 是 best-effort，
#      自 2026 年 8 月下旬起出现大面积「延迟数小时 → 然后彻底不再产生运行」的故障，
#      仓库侧无任何报错，只在按按钮手动跑时正常。详见 README「为什么不用 GitHub 自带 cron」。
#
#   2) schedule —— **兜底**。GitHub 自带的 cron，刻意安排在比主触发晚 1 小时。
#      万一它哪天恢复可用，脚本会用「今日已成功运行」去重，不会重复推送卡片。
#      （去重逻辑见 scripts/wb_daily.py 的 already_succeeded_today）
on:
  schedule:
    # cron 用 UTC。03:10 UTC = 11:10 中国标准时间（比主触发晚 1 小时，作兜底）
    - cron: "10 3 * * *"
  workflow_dispatch:

# 同一时间只允许一个实例，避免主触发与兜底撞车导致重复调用写接口
concurrency:
  group: workbuddy-daily
  cancel-in-progress: false

permissions:
  contents: read
  # 只读地列出本仓库的 workflow 运行记录，供脚本做「今日是否已跑过」去重
  actions: read

jobs:
  daily:
    name: 签到 + 猫猫旅行
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 拉取脚本
        uses: actions/checkout@v4

      - name: 动态解析 Python 解释器
        # 不写死版本号或绝对路径，交给 runner 自己决定 python3 / python 是哪个
        run: |
          set -euo pipefail
          PY="$(command -v python3 || command -v python)"
          if [ -z "$PY" ]; then
            echo "runner 上找不到可用的 Python 解释器" >&2
            exit 1
          fi
          echo "使用解释器：$PY"
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: 执行每日任务
        # 凭证全部来自仓库 Secret，脚本不读本机登录态，也不向磁盘写入任何 token
        env:
          WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
          WB_REFRESH_TOKEN: ${{ secrets.WB_REFRESH_TOKEN }}
          WB_USER_ID: ${{ secrets.WB_USER_ID }}
          # 飞书自定义机器人 webhook（含 token，本身就是敏感值，必须走 Secret）
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          # 仅当机器人开启了「签名校验」时才需要；未开启留空即可
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # 仅当机器人设置了「自定义关键词」时才需要；消息必须包含该词
          FEISHU_KEYWORD: ${{ secrets.FEISHU_KEYWORD }}
          # 仅用于 schedule 兜底去重：查今天的运行记录。脚本内会被登记进脱敏表
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          "$PY" scripts/wb_daily.py
